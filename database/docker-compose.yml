services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-sqlserver
    hostname: library-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Strong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong!Passw0rd' -No -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10-alpine
    container_name: library-flyway
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - "-url=jdbc:sqlserver://library-sqlserver:1433;databaseName=LibraryDb;encrypt=true;trustServerCertificate=true"
      - "-user=sa"
      - "-password=Strong!Passw0rd"
      - "-locations=filesystem:/flyway/sql"
      - "-baselineOnMigrate=true"
      - "-validateMigrationNaming=true"
      - "migrate"
    volumes:
      - ./migrations:/flyway/sql:ro
    profiles:
      - tools

  # ⚠️ SOLO DESARROLLO LOCAL — siembra datos de prueba, incluido un usuario
  # con contraseña conocida y rol Administrator. Aislado en su propio profile
  # (`seed`) y con tabla de historial separada para no contaminar el
  # versionado real del esquema. Nunca ejecutar contra un ambiente compartido.
  flyway-seed:
    image: flyway/flyway:10-alpine
    container_name: library-flyway-seed
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - "-url=jdbc:sqlserver://library-sqlserver:1433;databaseName=LibraryDb;encrypt=true;trustServerCertificate=true"
      - "-user=sa"
      - "-password=Strong!Passw0rd"
      - "-locations=filesystem:/flyway/sql"
      - "-table=flyway_seed_history"
      - "-baselineOnMigrate=true"
      # baselineVersion=0 es imprescindible: el esquema dbo ya tiene objetos
      # creados por las migraciones reales, así que Flyway haría baseline en
      # la versión 1 por defecto y saltaría V001 sin ejecutarlo nunca.
      - "-baselineVersion=0"
      - "-validateMigrationNaming=true"
      - "migrate"
    volumes:
      - ./seed-dev:/flyway/sql:ro
    profiles:
      - seed

volumes:
  sqlserver-data:
    name: library-sqlserver-data
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-sqlserver
    hostname: library-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Strong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong!Passw0rd' -No -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10-alpine
    container_name: library-flyway
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - "-url=jdbc:sqlserver://library-sqlserver:1433;databaseName=LibraryDb;encrypt=true;trustServerCertificate=true"
      - "-user=sa"
      - "-password=Strong!Passw0rd"
      - "-locations=filesystem:/flyway/sql"
      - "-baselineOnMigrate=true"
      - "-validateMigrationNaming=true"
      - "migrate"
    volumes:
      - ./migrations:/flyway/sql:ro
    profiles:
      - tools

volumes:
  sqlserver-data:
    name: library-sqlserver-data
<h1>Categories</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="create-form">
  <input type="text" formControlName="name" placeholder="Name" />
  <input type="text" formControlName="description" placeholder="Description (optional)" />
  <button type="submit" [disabled]="isCreating()">
    {{ isCreating() ? 'Creating...' : 'Create' }}
  </button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (category of categories(); track category.id) {
      <tr (dblclick)="openDetail(category)">
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>
        <td><button type="button" (click)="openDetail(category)">View</button></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">No categories yet.</td>
      </tr>
    }
  </tbody>
</table>


@if (selectedCategory(); as selected) {
  <app-category-detail
    [category]="selected"
    (close)="closeDetail()"
    (saved)="refreshAndClose()"
    (deleted)="refreshAndClose()"
  />
}

<nav data-cy="main-nav">
  <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" data-cy="nav-home">Home</a>
  <a routerLink="categories" routerLinkActive="active" data-cy="nav-categories">Categories</a>
  <a routerLink="books" routerLinkActive="active" data-cy="nav-books">Books</a>
  @if (authState.isStaff()) {
    <a routerLink="loans" routerLinkActive="active" data-cy="nav-loans">Loans</a>
  }

  @if (authState.isAuthenticated()) {
    <button type="button" (click)="logout()" data-cy="nav-logout">Logout</button>
  } @else {
    <a routerLink="login" routerLinkActive="active" data-cy="nav-login">Login</a>
    <a routerLink="register" routerLinkActive="active" data-cy="nav-register">Register</a>
  }
</nav>


<main>
  <router-outlet />
</main>
